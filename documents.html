<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dokumendid - Portfoolio</title> 
    <meta name="description" content="CV, motivatsiooni kiri ja SWOT analüüs">
    <meta name="keywords" content="CV, dokumendid, motivatsiooni kiri, SWOT">
    
    <meta property="og:title" content="Dokumendid - Portfoolio">
    <meta property="og:description" content="CV, motivatsiooni kiri ja SWOT analüüs">
    
    <meta name="twitter:title" content="Dokumendid - Portfoolio">
    <meta name="twitter:description" content="CV, motivatsiooni kiri ja SWOT analüüs">

    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #2563eb;
            --secondary-color: #f3f4f6;
            --text-primary: #111827;
            --text-secondary: #6b7280;
        }
    }

    @layer base {
        body {
            @apply bg-white text-[var(--text-primary)] font-sans;
        }
        
        h1, h2, h3, h4, h5, h6 {
            @apply font-bold;
        }
    }

    @layer components {
        .btn {
            @apply px-6 py-3 rounded-lg font-medium transition-all duration-300;
        }
        
        .btn-primary {
            @apply bg-[var(--primary-color)] text-white hover:opacity-90;
        }
    }
    </style>

</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="utils/translations.js"></script>
    <script type="text/babel" src="components/Header.js"></script>
    <script type="text/babel" src="components/Footer.js"></script>
    <script type="text/babel">
      function DocumentsPage() {
        const [language, setLanguage] = React.useState(localStorage.getItem('language') || 'et');
        const [selectedDocument, setSelectedDocument] = React.useState(null);

        React.useEffect(() => {
          const handleLanguageChange = (e) => {
            setLanguage(e.detail);
          };
          window.addEventListener('languageChange', handleLanguageChange);
          return () => window.removeEventListener('languageChange', handleLanguageChange);
        }, []);

        const content = {
          et: {
            title: 'Dokumendid',
            cv: 'CV',
            motivation: 'Motivatsiooni kiri',
            swot: 'SWOT analüüs',
            view: 'Vaata',
            close: 'Sulge'
          },
          en: {
            title: 'Documents',
            cv: 'CV',
            motivation: 'Cover Letter',
            swot: 'SWOT Analysis',
            view: 'View',
            close: 'Close'
          }
        };

        const t = content[language];

        const documents = {
          cv: {
            title: t.cv,
            url: 'dokumendid/CVKeskus_Mark_Grintšin_2827935 (1).pdf'
          },
          motivation: {
            title: t.motivation,
            url: 'dokumendid/Motivatsiooni kiri.pdf'
          },
          swot: {
            title: t.swot,
            url: 'dokumendid/SWOT_analüüs_tööleht_täitmiseks_Mark_IT25.pdf'
          }
        };

        return (
          <>
            <section className="pt-24 pb-20">
              <div className="container mx-auto px-6">
                <h1 className="text-5xl font-bold text-center mb-12">{t.title}</h1>
                
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-5xl mx-auto">
                  {Object.entries(documents).map(([key, doc]) => (
                    <div key={key} className="bg-white border-2 border-[var(--primary-color)] rounded-lg p-6 hover:shadow-lg transition-shadow">
                      <h2 className="text-2xl font-bold mb-4">{doc.title}</h2>
                      <button
                        onClick={() => setSelectedDocument(key)}
                        className="w-full btn btn-primary"
                      >
                        {t.view}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {selectedDocument && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-lg max-h-screen w-full overflow-hidden flex flex-col" style={{ maxWidth: '90vw', height: '90vh' }}>
                  <div className="flex justify-between items-center p-6 border-b">
                    <h2 className="text-2xl font-bold">{documents[selectedDocument].title}</h2>
                    <button
                      onClick={() => setSelectedDocument(null)}
                      className="text-2xl font-bold cursor-pointer hover:text-[var(--primary-color)]"
                    >
                      ✕
                    </button>
                  </div>
                  <div className="flex-1 overflow-auto">
                    {documents[selectedDocument].url.endsWith('.pdf') ? (
                      <iframe
                        src={documents[selectedDocument].url}
                        className="w-full h-full"
                        title={documents[selectedDocument].title}
                      ></iframe>
                    ) : (
                      <div className="p-8">
                        <div className="bg-gray-100 p-8 rounded-lg text-center">
                          <p className="mb-4 text-gray-700">Klikkige allolevat nuppu dokumendi allalaadimiseks</p>
                          <a
                            href={documents[selectedDocument].url}
                            download
                            className="btn btn-primary inline-block"
                          >
                            Laadi alla ↓
                          </a>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <div>
          <Header />
          <DocumentsPage />
          <Footer />
        </div>
      );
    </script>
</body>
</html>
